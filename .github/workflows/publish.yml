on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Build and deploy book

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::kableExtra
            any::rcompanion
            github::AURA-Lab-SIUE/v2v-r

      - uses: quarto-dev/quarto-actions/setup@v2

      # Single site (2026-07-24): one build. The graduate extensions ship in
      # every page as .graduate-extension blocks, hidden by CSS and revealed by
      # the reader's in-page toggle (see custom.scss + _quarto.yml
      # include-after-body). No separate grad profile render — the visitor
      # chooses the edition at read time, not at build time.
      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
