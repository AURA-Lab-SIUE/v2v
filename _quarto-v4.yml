# The 4th edition's table of contents: 7 chapters carried over from the 3rd
# edition plus the 20 rewritten drafts in chapters/_v3-draft/, then all 17 Excel
# supplements and the appendix.
#
# This file is NOT a Quarto profile and NOT a usable project config on its own.
# tools/render-v4.sh splices the chapters block below into a copy of
# _quarto.yml and renders that, because a Quarto profile would APPEND this list
# to the 3rd edition's rather than replace it. See the script for the detail.
#
# THE PART STRUCTURE IS NOT A GUESS. It is read off the drafts themselves, which
# state it in their own prose and would contradict any other arrangement:
#   ch02  "Chapters 7 through 15 and Part VI" are social scientific;
#         "Part IV" is interpretive; "Part V" is critical
#   ch15  "Every method in Part III collects something" /
#         "Part III ends here, and with it the quantitative methods half"
#   ch16  "Part IV is the qualitative half of the book"
#   ch21  "Part IV ends here. Chapter 22 opens Part V"
#   ch23  "Part V ends here ... Part VI returns to data"
#   ch24  "Part VI is where a project stops being a design and becomes a result"
# An earlier version of this file split Part III at chapter 11 and put the
# qualitative chapters in Part V. It rendered, and it was wrong, and the only
# thing that caught it was reading chapter 2's own cross-references.
#
# Keep this list as the single authoritative statement of the v4 running order.

book:
  chapters:
    - index.qmd
    - part: "Part I: Foundation"
      chapters:
        - chapters/chapter01.qmd
        - chapters/_v3-draft/chapter02-three-paradigms.qmd
        - chapters/chapter03.qmd
    - part: "Part II: Planning"
      chapters:
        - chapters/chapter04.qmd
        - chapters/chapter05.qmd
        - chapters/chapter06.qmd
    - part: "Part III: Quantitative Methods"
