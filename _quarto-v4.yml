        - chapters/_v3-draft/chapter10-reliability-and-validity.qmd
        - chapters/chapter11.qmd
        - chapters/_v3-draft/chapter12-quantitative-content-analysis.qmd
        - chapters/_v3-draft/chapter13-survey-research.qmd
        - chapters/_v3-draft/chapter14-experimental-design.qmd
        - chapters/_v3-draft/chapter15-existing-data.qmd
    - part: "Part IV: Qualitative Methods"
      chapters:
        - chapters/_v3-draft/chapter16-qualitative-interviewing.qmd
        - chapters/_v3-draft/chapter17-focus-groups.qmd
        - chapters/_v3-draft/chapter18-ethnography.qmd
        - chapters/_v3-draft/chapter19-qualitative-content-analysis.qmd
        - chapters/_v3-draft/chapter20-discourse-conversation-analysis.qmd
        - chapters/_v3-draft/chapter21-qualitative-data-analysis.qmd
    - part: "Part V: Rhetorical and Critical Analysis"
