meta:
  name: V2V (Vibes to Variables)
  link: https://github.com/AURA-Lab-SIUE/v2v

color:
  palette:
    chalk:        "#F4F0EB"
    surface:      "#ECE7E0"
    ink:          "#18181B"
    text:         "#27272A"
    muted:        "#52525B"   # AA-safe on chalk (6.8:1); shared with v2v-hub
    violet:       "#7C3AED"
    violet-dark:  "#6D28D9"
    amber:        "#F59E0B"
    rule:         "#E5DFD6"
  background: chalk
  foreground: ink
  primary: violet
  secondary: amber
  link: violet

typography:
  fonts:
    - family: Fraunces
      source: google
    - family: Instrument Sans
      source: google
    - family: JetBrains Mono
      source: google
  base:
    family: Instrument Sans
    size: 1.0625em
    line-height: 1.6
    weight: 400
  headings:
    family: Fraunces
    weight: 700
    color: ink
  monospace:
    family: JetBrains Mono
    size: 0.92em
  link:
    color: violet
    decoration: underline
