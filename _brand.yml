meta:
  name: From Vibes to Variables
  link: https://github.com/SIM-Lab-SIUE/vibes-to-variables

color:
  palette:
    paper: "#fafaf7"
    ink: "#1a1a1a"
    maroon: "#8b1a1a"
    code-bg: "#f3f1eb"
    callout-accent: "#5a7a8b"
    muted: "#6b6b6b"
  background: paper
  foreground: ink
  primary: maroon
  secondary: callout-accent
  link: maroon

typography:
  fonts:
    - family: Source Serif 4
      source: google
    - family: Source Sans 3
      source: google
    - family: JetBrains Mono
      source: google
  base:
    family: Source Serif 4
    size: 1.05em
    line-height: 1.6
    weight: 400
  headings:
    family: Source Sans 3
    weight: 600
    color: ink
  monospace:
    family: JetBrains Mono
    size: 0.92em
  link:
    color: maroon
    decoration: underline
