project:
  type: book
  output-dir: docs

book:
  title: "From Vibes to Variables"
  subtitle: "A Field Guide to Open Media Science"
  author: "Alex P. Leith"
  date: "2026"
  edition: "2nd"
  license: "CC BY 4.0"
  repo-url: https://github.com/SIM-Lab-SIUE/vibes-to-variables
  repo-actions: [issue]
  search: true
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Part I: Foundations"
      chapters:
        - chapters/chapter01.qmd
        - chapters/chapter02.qmd
        - chapters/chapter03.qmd
    - part: "Part II: Design"
      chapters:
        - chapters/chapter04.qmd
        - chapters/chapter05.qmd
        - chapters/chapter06.qmd
        - chapters/chapter07.qmd
        - chapters/chapter08.qmd
    - part: "Part III: Methods"
      chapters:
        - chapters/chapter09.qmd
        - chapters/chapter10.qmd
        - chapters/chapter11.qmd
        - chapters/chapter12.qmd
        - chapters/chapter13.qmd
        - chapters/chapter14.qmd
        - chapters/chapter15.qmd
        - chapters/chapter16.qmd
    - part: "Part IV: Analysis"
      chapters:
        - chapters/chapter17.qmd
        - chapters/chapter18.qmd
        - chapters/chapter19.qmd
        - chapters/chapter20.qmd
    - part: "Part V: Publishing"
      chapters:
        - chapters/chapter21.qmd
        - chapters/chapter22.qmd
    - part: "Appendices"
      chapters:
        - appendices/data-dictionary.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    number-sections: false
    code-fold: true
    code-tools: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  pdf:
    documentclass: book
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    toc: true
    toc-depth: 2
    number-sections: false
    colorlinks: true
    link-citations: true
    keep-tex: false
