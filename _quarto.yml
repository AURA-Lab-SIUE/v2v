project:
  type: book
  output-dir: docs

lang: en

# Twitch @mentions in the sample chat data (@xqcow, @forsen, @GiantWaffle ...) are
# parsed by Pandoc as CITATION KEYS and compiled to #cite(<xqcow>) in Typst, which
# aborts the build: "the document does not contain a bibliography". The book has no
# real Pandoc citations - references are written literally as "(Wickham, 2016)" - so
# the citation extension is pure downside here. Turning it off makes the data render
# as the literal text it is, in every output format.
from: markdown-citations

book:
  title: "Vibes to Variables"
  subtitle: "A Methods Package for Students New to Research, Stats, and Code"
  author: "Alex P. Leith"
  date: "2026-05-18"
  date-format: "MMMM YYYY"
  edition: "3rd"
  license: "CC BY 4.0"
  repo-url: https://github.com/AURA-Lab-SIUE/v2v
  repo-actions: [issue]
  search: true
  # The site is the deliverable; the tagged PDF is downloadable FROM it.
  downloads: [pdf]
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Part I: Foundation"
      chapters:
        - chapters/chapter01.qmd
        - chapters/chapter02.qmd
        - chapters/chapter03.qmd
    - part: "Part II: Planning"
      chapters:
        - chapters/chapter04.qmd
        - chapters/chapter05.qmd
        - chapters/chapter06.qmd
    - part: "Part III: Operationalization"
      chapters:
        - chapters/chapter07.qmd
        - chapters/chapter08.qmd
        - chapters/chapter09.qmd
    - part: "Part IV: Execution"
      chapters:
        - chapters/chapter10.qmd
        - chapters/chapter11.qmd
        - chapters/chapter12.qmd
    - part: "Part V: Inference and Publication"
      chapters:
        - chapters/chapter13.qmd
        - chapters/chapter14.qmd
    - part: "Appendices"
      chapters:
        - appendices/data-dictionary.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    number-sections: false
    code-fold: true
    code-tools: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  # Typst, NOT LaTeX. A LaTeX PDF is UNTAGGED - no /StructTreeRoot, no /Alt -
  # so every fig-alt in this book would be silently discarded in the PDF and
  # Ally would score it red no matter how clean the source is. Typst emits a
  # tagged PDF, which is what makes the downloadable copy actually accessible.
  # Verify after any toolchain change by probing the built PDF for
  # /StructTreeRoot and a non-zero /Alt count.
  typst:
    papersize: us-letter
    fontsize: 11pt
    margin:
      x: 1in
      y: 1in
    toc: true
    toc-depth: 2
    section-numbering: none
