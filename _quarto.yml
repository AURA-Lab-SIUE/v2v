project:
  type: book
  output-dir: docs
  resources:
    - audio

lang: en

# Twitch @mentions in the sample chat data (@xqcow, @forsen, @GiantWaffle ...) are
# parsed by Pandoc as CITATION KEYS and compiled to #cite(<xqcow>) in Typst, which
# aborts the build: "the document does not contain a bibliography". The book has no
# real Pandoc citations - references are written literally as "(Wickham, 2016)" - so
# the citation extension is pure downside here. Turning it off makes the data render
# as the literal text it is, in every output format.
from: markdown-citations

book:
  title: "Vibes to Variables"
  subtitle: "A Methods Package for Students New to Research, Stats, and Code"
  author: "Alex P. Leith"
  date: "2026-05-18"
  date-format: "MMMM YYYY"
  edition: "3rd"
  license: "CC BY 4.0"
  repo-url: https://github.com/AURA-Lab-SIUE/v2v
  repo-actions: [issue]
  search: true
  # The site is the deliverable; the tagged PDF and the EPUB are downloadable
  # FROM it. Both are produced by the same `quarto render` that builds the site,
  # so a download can never be a stale copy of a newer web version.
  downloads: [pdf, epub]
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Part I: Foundation"
      chapters:
        - chapters/chapter01.qmd
        - chapters/chapter02.qmd
        - chapters/chapter03.qmd
    - part: "Part II: Planning"
      chapters:
        - chapters/chapter04.qmd
        - chapters/chapter05.qmd
        - chapters/chapter06.qmd
    - part: "Part III: Operationalization"
      chapters:
        - chapters/chapter07.qmd
        - chapters/chapter08.qmd
        - chapters/chapter09.qmd
    - part: "Part IV: Execution"
      chapters:
        - chapters/chapter10.qmd
        - chapters/chapter11.qmd
        - chapters/chapter12.qmd
    - part: "Part V: Inference and Publication"
      chapters:
        - chapters/chapter13.qmd
        - chapters/chapter14.qmd
    - part: "Appendices"
      chapters:
        - appendices/data-dictionary.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    number-sections: false
    code-fold: true
    code-tools: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    include-after-body:
      text: |
        <script>
        (function(){
          var KEY = 'v2v-show-grad-ext';
          function apply(on){
            document.body.classList.toggle('show-grad-ext', on);
            var b = document.getElementById('v2v-edition-toggle');
            if(b){
              b.setAttribute('aria-pressed', on ? 'true' : 'false');
              b.querySelector('.label').textContent = on ? 'Graduate edition: on' : 'Graduate edition: off';
            }
          }
          document.addEventListener('DOMContentLoaded', function(){
            var on = localStorage.getItem(KEY) === '1';
            var btn = document.createElement('button');
            btn.id = 'v2v-edition-toggle';
            btn.type = 'button';
            btn.title = 'Show or hide the graduate extensions (MC 501). Your choice is remembered across pages.';
            btn.innerHTML = '<span class="dot" aria-hidden="true"></span><span class="label"></span>';
            btn.addEventListener('click', function(){
              var now = !(localStorage.getItem(KEY) === '1');
              localStorage.setItem(KEY, now ? '1' : '0');
              apply(now);
            });
            document.body.appendChild(btn);
            apply(on);
          });
        })();
        </script>
        <script>
        /* a11y-2026-07-30 scrollable-pre: overflowing <pre> blocks scroll
           horizontally, and with no focusable content a keyboard-only reader
           cannot scroll them, so the truncated code is unreachable (WCAG 2.1.1).
           tabindex="0" is the minimum that fixes it. We deliberately do NOT add
           role="region": that would put every code block in the landmark list
           and make the page markedly noisier to navigate by screen reader. */
        (function(){
          function mark(){
            document.querySelectorAll('pre').forEach(function(el){
              var scrolls = el.scrollWidth > el.clientWidth + 1 ||
                            el.scrollHeight > el.clientHeight + 1;
              if (scrolls && !el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
            });
          }
          if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', mark);
          else mark();
          window.addEventListener('load', mark);
          window.addEventListener('resize', mark);
          /* code-fold blocks measure 0 until opened */
          document.addEventListener('toggle', mark, true);
        })();
        </script>
  # Typst, NOT LaTeX. A LaTeX PDF is UNTAGGED - no /StructTreeRoot, no /Alt -
  # so every fig-alt in this book would be silently discarded in the PDF and
  # Ally would score it red no matter how clean the source is. Typst emits a
  # tagged PDF, which is what makes the downloadable copy actually accessible.
  # Verify after any toolchain change by probing the built PDF for
  # /StructTreeRoot and a non-zero /Alt count.
  typst:
    # Typst cannot reach Google Fonts, and Quarto bundles only Font Awesome, so
    # without these the PDF silently fell back to a default serif for every
    # heading while the website rendered correctly. Vendored so the build does
    # not depend on the fonts a given machine happens to have.
    font-paths:
      - tools/fonts
    papersize: us-letter
    fontsize: 11pt
    margin:
      x: 1in
      y: 1in
    toc: true
    toc-depth: 2
    # Both partials replace orange-book's. See the headers in each file: the
    # template drew chapter banners with outset that bled off every chapter
    # opener, gave each chapter an otherwise-blank title page, and tinted the
    # title block pink. Its numbering.typ is deliberately left in place, because
    # chapter-based figure numbering is what a textbook wants.
    template-partials:
      - tools/typst/page.typ
      - tools/typst/typst-show.typ

  # EPUB is for reading on a phone, an e-reader, or in a screen-reader app that
  # handles reflowable text better than a fixed-page PDF. It deliberately
  # carries none of the HTML block's injected scripts: the graduate-extension
  # toggle and the scrollable-pre fix are browser behaviours, and an EPUB reader
  # would either ignore them or choke. Reflowable text makes the pre-block
  # problem moot anyway.
  epub:
    toc: true
    toc-depth: 2
    number-sections: false
    # Cover is generated from the book's own data by tools/cover/make_cover.py:
    # the message-length distribution of all 35,267 messages in the chat
    # fixture, which is the histogram a reader meets in Chapter 12. Regenerate
    # it rather than editing the PNG by hand.
    epub-cover-image: images/cover.png
    section-numbering: none
